[package]
name = "seekr"
version = "0.1.0"
edition = "2021"
description = "Local-first terminal command history search and recall"
license = "MIT"
repository = "https://github.com/joashdev/Seekr"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
